name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release Assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev dpkg-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package .deb and tarball
        run: |
          chmod +x scripts/package-deb.sh scripts/package-tarball.sh
          ./scripts/package-deb.sh
          ./scripts/package-tarball.sh
          sha256sum deskstamp-*.tar.gz deskstamp_*.deb > SHA256SUMS.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deskstamp-*.tar.gz
            deskstamp_*.deb
            SHA256SUMS.txt
          generate_release_notes: true
