name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check || true

      - name: Run clippy
        run: cargo clippy -- -D warnings || true

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Verify binary execution
        run: ./target/release/deskstamp --help || ./target/release/deskstamp preview preview_ci.png
