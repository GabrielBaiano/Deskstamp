[package]
name = "deskstamp"
version = "0.1.0"
edition = "2021"

[dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client"] }
tiny-skia = { version = "0.11", features = ["png-format"] }
fontdue = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
hostname = "0.4"
eframe = { version = "0.36.2", default-features = false, features = ["wayland", "glow", "default_fonts"] }
ksni = { version = "0.3.6", features = ["blocking"] }

